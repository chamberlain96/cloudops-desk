name: CloudOps Desk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --log-opts="--all"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-security.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Scan Python code with Bandit
        run: python -m bandit -r app

      - name: Build Docker image
        run: docker build -t cloudops-desk:${{ github.sha }} .

      - name: Export image for scanning
        run: |
          mkdir -p /tmp/cloudops-scan
          docker save cloudops-desk:${{ github.sha }} \
            -o /tmp/cloudops-scan/image.tar

      - name: Generate full vulnerability report
        run: |
          docker run --rm \
            --mount type=bind,source=/tmp/cloudops-scan,target=/scan \
            --mount source=trivy-cache,target=/root/.cache/trivy \
            aquasec/trivy:0.75.0 \
            image --input /scan/image.tar \
            --scanners vuln --format json \
            --output /scan/trivy-report.json

      - name: Save vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: /tmp/cloudops-scan/trivy-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            --mount type=bind,source=/tmp/cloudops-scan,target=/scan,readonly \
            --mount source=trivy-cache,target=/root/.cache/trivy \
            aquasec/trivy:0.75.0 \
            image --input /scan/image.tar \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1

      - name: Start container for smoke test
        run: |
          docker volume create ci-ticket-data

          docker run --rm \
            --mount source=ci-ticket-data,target=/app/instance \
            cloudops-desk:${{ github.sha }} \
            python -m flask --app app:create_app init-db

          docker run -d \
            --name cloudops-ci \
            -p 127.0.0.1:5002:5000 \
            --mount source=ci-ticket-data,target=/app/instance \
            cloudops-desk:${{ github.sha }}

      - name: Verify container health and ticket storage
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:5002"

          for attempt in range(30):
              try:
                  with urlopen(base + "/health", timeout=2) as response:
                      assert response.status == 200
                      assert json.load(response)["status"] == "ok"
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise SystemExit("Container did not become ready")

          request = Request(
              base + "/tickets",
              data=json.dumps({
                  "title": "CI smoke test",
                  "description": "Verify the built container"
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urlopen(request, timeout=5) as response:
              assert response.status == 201
              ticket = json.load(response)

          with urlopen(
              base + f"/tickets/{ticket['id']}", timeout=5
          ) as response:
              assert response.status == 200
              saved = json.load(response)
              assert saved["title"] == "CI smoke test"
              assert saved["status"] == "open"

          print("PASS: container starts, saves, and retrieves tickets")
          PY

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect cloudops-ci >/dev/null 2>&1; then
            docker logs cloudops-ci
          fi

      - name: Clean up smoke test
        if: always()
        run: |
          if docker container inspect cloudops-ci >/dev/null 2>&1; then
            docker rm -f cloudops-ci
          fi

          if docker volume inspect ci-ticket-data >/dev/null 2>&1; then
            docker volume rm ci-ticket-data
          fi
