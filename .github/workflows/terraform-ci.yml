name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap validate

      - name: Initialize development without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false -lockfile=readonly

      - name: Validate development
        run: terraform -chdir=infra/environments/dev validate
