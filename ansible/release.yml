---
- name: Configure Docker host
  ansible.builtin.import_playbook: site.yml

- name: Prepare application image from ECR
  ansible.builtin.import_playbook: prepare-ecr.yml

- name: Prepare secure RDS configuration
  ansible.builtin.import_playbook: prepare-rds-config.yml

- name: Deploy main application using RDS
  ansible.builtin.import_playbook: deploy-rds-production.yml
